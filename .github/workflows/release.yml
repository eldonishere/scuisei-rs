name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify_version:
    name: Verify tag/version alignment
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Parse version from tag
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          echo "value=${tag_version}" >> "$GITHUB_OUTPUT"

      - name: Validate version in Cargo.toml and pyproject.toml
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${{ steps.version.outputs.value }}"
          cargo_version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          pyproject_version="$(awk -F'"' '/^version = / { print $2; exit }' pyproject.toml)"

          if [ "${tag_version}" != "${cargo_version}" ]; then
            echo "Tag version (${tag_version}) does not match Cargo.toml (${cargo_version})."
            exit 1
          fi

          if [ "${tag_version}" != "${pyproject_version}" ]; then
            echo "Tag version (${tag_version}) does not match pyproject.toml (${pyproject_version})."
            exit 1
          fi

  build_wheels:
    name: Build wheel and binary (${{ matrix.os }})
    needs: verify_version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config patchelf nasm libavcodec-dev libavformat-dev libavutil-dev libswscale-dev

      - name: Install FFmpeg dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew update && brew install pkg-config ffmpeg

      - name: Install FFmpeg dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\ffmpeg-release-full-shared.7z"
          $extractRoot = "$env:RUNNER_TEMP\ffmpeg"
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip --no-progress -y
          }
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z" -OutFile $archive
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          & 7z x $archive "-o$extractRoot" -y | Out-Null
          $ffmpegDir = Get-ChildItem -Path $extractRoot -Directory | Select-Object -First 1
          if (-not $ffmpegDir) {
            throw "Failed to locate extracted FFmpeg directory"
          }
          "FFMPEG_DIR=$($ffmpegDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($ffmpegDir.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Install macOS wheel repair tooling
        if: runner.os == 'macOS'
        run: python -m pip install --upgrade delocate

      - name: Install Windows wheel repair tooling
        if: runner.os == 'Windows'
        run: python -m pip install --upgrade delvewheel

      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        run: maturin build -b pyo3 --release --strip --features "python,ffmpeg-build" --out dist/unrepaired

      - name: Build wheel (macOS/Windows)
        if: runner.os != 'Linux'
        run: maturin build -b pyo3 --release --features python --out dist/unrepaired

      - name: Repair wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp dist/unrepaired/*.whl dist/

      - name: Repair wheel (macOS)
        if: runner.os == 'macOS'
        run: python -m delocate.cmd.delocate_wheel --wheel-dir dist dist/unrepaired/*.whl

      - name: Repair wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\unrepaired\*.whl | Select-Object -First 1
          if (-not $wheel) {
            throw "No wheel found in dist/unrepaired"
          }
          $ffmpegBin = "$env:FFMPEG_DIR\bin"
          python -m delvewheel repair --add-path $ffmpegBin -w dist $wheel.FullName

      - name: Verify wheel bundles FFmpeg runtime (Linux)
        if: runner.os == 'Linux'
        run: python scripts/check_wheel_ffmpeg_runtime.py --platform linux --allow-static --wheel-glob "dist/*.whl"

      - name: Verify wheel bundles FFmpeg runtime (macOS)
        if: runner.os == 'macOS'
        run: python scripts/check_wheel_ffmpeg_runtime.py --platform macos --wheel-glob "dist/*.whl"

      - name: Verify wheel bundles FFmpeg runtime (Windows)
        if: runner.os == 'Windows'
        run: python scripts/check_wheel_ffmpeg_runtime.py --platform windows --wheel-glob "dist/*.whl"

      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Run Python integration smoke test
        run: python scripts/python_integration_smoke.py

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-${{ matrix.os }}
          path: dist/*.whl

      - name: Build CLI binary
        run: cargo build --release --bin scuisei-rs

      - name: Package CLI binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          os="$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')"
          arch="$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')"
          tar -C target/release -czf "dist/scuisei-rs-${os}-${arch}.tar.gz" scuisei-rs

      - name: Package CLI binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $os = $env:RUNNER_OS.ToLowerInvariant()
          $arch = $env:RUNNER_ARCH.ToLowerInvariant()
          Compress-Archive -Path target/release/scuisei-rs.exe -DestinationPath "dist/scuisei-rs-$os-$arch.zip" -Force

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: dist/scuisei-rs-*

  build_sdist:
    name: Build source distribution
    needs: verify_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build sdist
        run: maturin sdist --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  publish_pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scuisei-rs
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github_release:
    name: Create GitHub release
    needs: [verify_version, build_wheels, build_sdist, publish_pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: scuisei-rs ${{ needs.verify_version.outputs.version }}
          generate_release_notes: true
          files: dist/*
