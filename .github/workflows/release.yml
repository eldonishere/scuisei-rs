name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  MACOS_FFMPEG_FORMULA: ffmpeg@7
  WINDOWS_FFMPEG_VERSION: 8.0.1

permissions:
  contents: read

jobs:
  verify_version:
    name: Verify tag/version alignment
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Parse version from tag
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          echo "value=${tag_version}" >> "$GITHUB_OUTPUT"

      - name: Validate version in Cargo.toml and pyproject.toml
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${{ steps.version.outputs.value }}"
          cargo_version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          pyproject_version="$(awk -F'"' '/^version = / { print $2; exit }' pyproject.toml)"

          if [ "${tag_version}" != "${cargo_version}" ]; then
            echo "Tag version (${tag_version}) does not match Cargo.toml (${cargo_version})."
            exit 1
          fi

          if [ "${tag_version}" != "${pyproject_version}" ]; then
            echo "Tag version (${tag_version}) does not match pyproject.toml (${pyproject_version})."
            exit 1
          fi

  build_wheels:
    name: Build wheel and binary (${{ matrix.os }})
    needs: verify_version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config patchelf nasm libavcodec-dev libavformat-dev libavutil-dev libswscale-dev

      - name: Install FFmpeg dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install pkg-config "${MACOS_FFMPEG_FORMULA}"
          ffmpeg_prefix="$(brew --prefix "${MACOS_FFMPEG_FORMULA}")"
          echo "PKG_CONFIG_PATH=${ffmpeg_prefix}/lib/pkgconfig:${ffmpeg_prefix}/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${ffmpeg_prefix}/lib${LIBRARY_PATH:+:${LIBRARY_PATH}}" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=${ffmpeg_prefix}/lib${DYLD_FALLBACK_LIBRARY_PATH:+:${DYLD_FALLBACK_LIBRARY_PATH}}" >> "$GITHUB_ENV"
          echo "${ffmpeg_prefix}/bin" >> "$GITHUB_PATH"

      - name: Install FFmpeg dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpegVersion = "${{ env.WINDOWS_FFMPEG_VERSION }}"
          $archive = "$env:RUNNER_TEMP\ffmpeg-$ffmpegVersion-full_build-shared.zip"
          $extractRoot = "$env:RUNNER_TEMP\ffmpeg"
          $asset = "ffmpeg-$ffmpegVersion-full_build-shared.zip"
          $uri = "https://github.com/GyanD/codexffmpeg/releases/download/$ffmpegVersion/$asset"
          if (Test-Path $extractRoot) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          Invoke-WebRequest -Uri $uri -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force
          $ffmpegDir = Get-ChildItem -Path $extractRoot -Directory |
            Where-Object { $_.Name -like "ffmpeg-*-full_build-shared" } |
            Select-Object -First 1
          if (-not $ffmpegDir) {
            throw "Failed to locate extracted FFmpeg directory"
          }
          "FFMPEG_DIR=$($ffmpegDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($ffmpegDir.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Install macOS wheel repair tooling
        if: runner.os == 'macOS'
        run: python -m pip install --upgrade delocate

      - name: Install Windows wheel repair tooling
        if: runner.os == 'Windows'
        run: python -m pip install --upgrade delvewheel

      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        run: maturin build -b pyo3 --release --strip --features "python,ffmpeg-build" --out dist/unrepaired

      - name: Build wheel (macOS)
        if: runner.os == 'macOS'
        run: maturin build -b pyo3 --release --features python --out dist/unrepaired

      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        run: maturin build -b pyo3 --release --features python --auditwheel=repair --out dist

      - name: Repair wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp dist/unrepaired/*.whl dist/

      - name: Repair wheel (macOS)
        if: runner.os == 'macOS'
        run: python -m delocate.cmd.delocate_wheel --wheel-dir dist dist/unrepaired/*.whl

      - name: Verify wheel bundles FFmpeg runtime (Linux)
        if: runner.os == 'Linux'
        run: python scripts/check_wheel_ffmpeg_runtime.py --platform linux --allow-static --wheel-glob "dist/*.whl"

      - name: Verify wheel bundles FFmpeg runtime (macOS)
        if: runner.os == 'macOS'
        run: python scripts/check_wheel_ffmpeg_runtime.py --platform macos --wheel-glob "dist/*.whl"

      - name: Verify wheel bundles FFmpeg runtime (Windows)
        if: runner.os == 'Windows'
        run: python scripts/check_wheel_ffmpeg_runtime.py --platform windows --wheel-glob "dist/*.whl"

      - name: Add license notices to wheel
        run: python scripts/add_wheel_notices.py --wheel-glob "dist/*.whl" LICENSE LICENSE-GPL NOTICE-FFMPEG.md README.md

      - name: Install built wheel (Linux/macOS)
        if: runner.os != 'Windows'
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Install built wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          if (-not $wheel) {
            throw "No repaired wheel found in dist"
          }
          python -m pip install --force-reinstall $wheel.FullName

      - name: Run Python integration smoke test
        run: python scripts/python_integration_smoke.py

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-${{ matrix.os }}
          path: dist/*.whl

      - name: Build CLI binary
        run: cargo build --release --bin scuisei-rs

      - name: Package CLI binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          os="$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')"
          arch="$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')"
          version="${{ needs.verify_version.outputs.version }}"
          package_dir="dist/scuisei-rs-${os}-${arch}-${version}"
          mkdir -p "${package_dir}"
          cp target/release/scuisei-rs LICENSE LICENSE-GPL NOTICE-FFMPEG.md README.md "${package_dir}/"
          tar -C dist -czf "dist/scuisei-rs-${os}-${arch}-${version}.tar.gz" "scuisei-rs-${os}-${arch}-${version}"
          rm -rf "${package_dir}"

      - name: Package CLI binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $os = $env:RUNNER_OS.ToLowerInvariant()
          $arch = $env:RUNNER_ARCH.ToLowerInvariant()
          $version = "${{ needs.verify_version.outputs.version }}"
          $packageDir = "dist\scuisei-rs-$os-$arch-$version"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -Path target/release/scuisei-rs.exe, LICENSE, LICENSE-GPL, NOTICE-FFMPEG.md, README.md -Destination $packageDir
          Compress-Archive -Path $packageDir -DestinationPath "dist/scuisei-rs-$os-$arch-$version.zip" -Force
          Remove-Item -LiteralPath $packageDir -Recurse -Force

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: dist/scuisei-rs-*

  build_sdist:
    name: Build source distribution
    needs: verify_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build sdist
        run: maturin sdist --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  github_release:
    name: Create GitHub release
    needs: [verify_version, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: scuisei-rs ${{ needs.verify_version.outputs.version }}
          generate_release_notes: true
          files: dist/*
